# hw-sentinel default configuration
#
# This is the TEMPLATE. On first run it is copied to
#     %ProgramData%\hw-sentinel\config.toml
# and that copy is what you edit. Upgrades replace this file but never your copy, so
# your thresholds survive.
#
# ---------------------------------------------------------------------------------
# FIRST THING TO DO: check that the sensors below match your hardware.
#
#     hw-sentinel doctor
#
# Sensor names differ between CPU/GPU vendors, models, and LibreHardwareMonitor
# versions, so the patterns here cannot be right for every machine. `doctor` prints
# each rule as OK or FAIL. To see everything your hardware exposes:
#
#     hw-sentinel discover
#     hw-sentinel discover --filter voltage
#
# A pattern only needs to be unique — a path suffix or substring is enough. If a
# pattern matches more than one sensor, that is a hard error rather than a silent
# wrong guess: qualify it with the hardware name, e.g. change
#     "temperatures/gpu-core"  ->  "radeon-rx-9070-xt/temperatures/gpu-core"
# This happens on most AMD desktops, where the CPU's integrated graphics exposes
# sensors with the same names as the discrete card.
#
# If a sensor genuinely does not exist on your machine, set that rule's
# enabled = false rather than pointing it at something approximate. A safety alarm
# watching the wrong rail is worse than no alarm.
# ---------------------------------------------------------------------------------

[source]
url = "http://localhost:8085/data.json"
poll_interval = 1.0
timeout = 2.0

[card]
enabled = true
position = "right-center"   # right-top | right-center | right-bottom
margin_x = 24
margin_y = 24
width = 360
height = 96
gap = 8
slide_ms = 180
snooze_minutes = 15         # click a card to silence that rule this long
suppress_in_game = true     # hide the card when RTSS is showing the alert instead

[rtss]
enabled = true
owner = "hw-sentinel"
markup = true               # set false if RTSS shows the colour tags literally

[sound]
enabled = true
critical_only = false
min_interval = 30.0         # seconds before the same rule may sound again
warn_wav = "assets/warn.wav"
critical_wav = "assets/critical.wav"

[log]
enabled = true
path = "events.jsonl"       # relative to the folder holding this file

[deps]
# Launch LibreHardwareMonitor and RTSS as child processes, so only hw-sentinel needs
# an autostart entry. Children inherit its elevated token, which is how LHM gets the
# administrator rights it needs without a UAC prompt.
# Already-running copies are adopted, never duplicated.
manage = true
lhm_path = ""      # blank = search the install dir, then the usual locations
rtss_path = ""     # blank = search; not finding RTSS only costs in-game alerts
start_timeout = 25.0


# --- sensor aliases -----------------------------------------------------------
# alias = "pattern matched against LibreHardwareMonitor sensor paths"
# Run `hw-sentinel discover` and correct anything `doctor` reports as FAIL.

[sensors]
cpu_tctl        = "temperatures/core-tctl-tdie"
cpu_core_volts  = "voltages/vcore"
# Most boards do not label CPU SoC voltage. On AM5 the integrated GPU sits in the
# same I/O die powered by the SoC rail, which makes this a usable stand-in — but
# CONFIRM IT against your BIOS before trusting the alarm, or disable the rule.
cpu_soc_volts   = "voltages/gpu-soc"
gpu_core_temp   = "temperatures/gpu-core"
gpu_hotspot     = "temperatures/gpu-hot-spot"
gpu_core_volts  = "voltages/gpu-core"


# --- rules --------------------------------------------------------------------
# op/value  trip point            clear_at     hysteresis, must be on the safe side
# dwell     seconds over the line before tripping (kills transient spikes)
# cooldown  minimum seconds between one clear and the next trip
#
# The defaults suit a Ryzen 7 9800X3D + Radeon RX 9070 XT. Different silicon runs
# hotter or at different voltages — check them against your own idle and load
# readings before relying on them.

[rules.cpu_temp]
enabled     = true
title       = "CPU running hot"
label       = "Tctl"
sensor      = "cpu_tctl"
unit        = "°C"
op          = ">"
value       = 88
clear_at    = 83
dwell       = 10
clear_dwell = 15
cooldown    = 60
severity    = "warn"

# The AM5 SoC-overvolt failure mode. Worth knowing about immediately.
[rules.cpu_soc_voltage]
enabled     = true
title       = "CPU SoC voltage too high"
label       = "SoC"
sensor      = "cpu_soc_volts"
unit        = "V"
op          = ">"
value       = 1.30
clear_at    = 1.25
dwell       = 5
clear_dwell = 10
cooldown    = 120
severity    = "critical"

[rules.cpu_core_voltage]
enabled     = true
title       = "CPU core voltage high"
label       = "Vcore"
sensor      = "cpu_core_volts"
unit        = "V"
op          = ">"
value       = 1.40
clear_at    = 1.35
dwell       = 5
clear_dwell = 10
cooldown    = 120
severity    = "warn"

[rules.gpu_hotspot]
enabled     = true
title       = "GPU hot spot critical"
label       = "Junction"
sensor      = "gpu_hotspot"
unit        = "°C"
op          = ">"
value       = 100
clear_at    = 92
dwell       = 10
clear_dwell = 15
cooldown    = 60
severity    = "critical"

[rules.gpu_temp]
enabled     = true
title       = "GPU running hot"
label       = "GPU"
sensor      = "gpu_core_temp"
unit        = "°C"
op          = ">"
value       = 90
clear_at    = 84
dwell       = 10
clear_dwell = 15
cooldown    = 60
severity    = "warn"

# A widening gap between junction and edge is the early sign of degraded thermal
# paste or poor cold-plate contact. Long dwell: this is a trend, not an event.
[rules.gpu_hotspot_delta]
enabled     = true
title       = "GPU hot spot delta widening"
label       = "Delta"
expr        = "gpu_hotspot - gpu_core_temp"
unit        = "°C"
op          = ">"
value       = 25
clear_at    = 20
dwell       = 30
clear_dwell = 30
cooldown    = 300
severity    = "warn"

# Set just above the card's normal ceiling. Measured on an RX 9070 XT: idle
# 0.36-0.66 V, gaming peak 1.11 V. Too low and it fires during ordinary play; too
# high and it can never fire at all. Check your own peak before changing it.
[rules.gpu_core_voltage]
enabled     = true
title       = "GPU core voltage high"
label       = "GPU V"
sensor      = "gpu_core_volts"
unit        = "V"
op          = ">"
value       = 1.15
clear_at    = 1.10
dwell       = 5
clear_dwell = 10
cooldown    = 120
severity    = "warn"
